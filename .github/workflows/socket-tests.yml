name: BuildLab socket regression checks
on:
  push:
    branches: [feature/vlad-socket-compatibility-fix]
  pull_request:
    paths:
      - 'api/**'
      - 'public/**'
      - 'tests/**'
      - 'frontend/**'
      - '.github/workflows/socket-tests.yml'
permissions:
  contents: read
jobs:
  socket-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Python catalog and socket regression tests
        run: python -B -m unittest api.test_catalog_prices api.test_catalog_sockets api.test_catalog_rate_limits
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install frontend packages
        working-directory: frontend
        run: npm ci
      - name: Frontend and socket tests
        working-directory: frontend
        run: npm test
